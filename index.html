<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS PLAYER</title>
  
  <!-- Enlace al manifiesto y color de la barra del sistema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/jpeg" href="ICONO_ATLAS.jpg">

  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #141414;
      --bg-item: #1c1c1c;
      --accent-red: #e50914;
      --accent-hover: #ff1e27;
      --accent-glow: rgba(229, 9, 20, 0.35);
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px var(--accent-glow);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Cabecera y Logo Atlas */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .atlas-logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-red);
      box-shadow: 0 0 20px var(--accent-glow);
      background-color: #000;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .title span {
      color: var(--accent-red);
    }

    .track-info {
      text-align: center;
      height: 48px;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Barra de progreso */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border-color);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .time-box {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Controles de reproducción */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      color: var(--accent-red);
      transform: scale(1.1);
    }

    .btn-play {
      width: 58px;
      height: 58px;
      background: var(--accent-red);
      border-radius: 50%;
      color: #fff;
      font-size: 1.6rem;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-play:hover {
      background: var(--accent-hover);
      color: #fff;
      transform: scale(1.08);
    }

    /* Control de volumen */
    .volume-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
    }

    .volume-box span {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Selector de archivos y Playlist */
    .file-input-wrapper {
      position: relative;
      text-align: center;
    }

    .file-input-label {
      display: block;
      background: var(--bg-item);
      border: 1px dashed var(--accent-red);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .file-input-label:hover {
      background: rgba(229, 9, 20, 0.15);
    }

    #fileInput {
      display: none;
    }

    .playlist {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .playlist::-webkit-scrollbar {
      width: 4px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .playlist-item {
      background: var(--bg-item);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }

    .playlist-item:hover {
      background: #252525;
      border-color: var(--border-color);
    }

    .playlist-item.active {
      border-color: var(--accent-red);
      background: rgba(229, 9, 20, 0.15);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Cabecera con imagen -->
    <div class="header">
      <img src="ICONO_ATLAS.jpg" alt="Atlas" class="atlas-logo" onerror="this.src='https://via.placeholder.com/130/141414/e50914?text=ATLAS'">
      <div class="title">ATLAS <span>PLAYER</span></div>
    </div>

    <!-- Título de canción -->
    <div class="track-info">
      <div class="track-title" id="trackTitle">Selecciona tu música</div>
      <div class="track-artist" id="trackArtist">Sin reproducción activa</div>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-container">
      <input type="range" id="progressBar" class="slider" value="0" min="0" step="1">
      <div class="time-box">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button class="btn" id="prevBtn" title="Anterior">⏮</button>
      <button class="btn btn-play" id="playBtn" title="Reproducir">▶</button>
      <button class="btn" id="nextBtn" title="Siguiente">⏭</button>
    </div>

    <!-- Volumen -->
    <div class="volume-box">
      <span>🔈</span>
      <input type="range" id="volumeBar" class="slider" min="0" max="1" step="0.05" value="1">
      <span>🔊</span>
    </div>

    <!-- Cargar archivos -->
    <div class="file-input-wrapper">
      <label for="fileInput" class="file-input-label">📁 Cargar canciones desde tu equipo</label>
      <input type="file" id="fileInput" accept="audio/*" multiple>
    </div>

    <!-- Lista de reproducción -->
    <div class="playlist" id="playlist"></div>

  </div>

  <audio id="audioElement"></audio>

  <script>
    const audio = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeBar = document.getElementById('volumeBar');
    const fileInput = document.getElementById('fileInput');
    const playlistEl = document.getElementById('playlist');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');

    let tracks = [];
    let currentIndex = 0;

    // Cargar archivos locales
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      tracks = files.map((file) => ({
        title: file.name.replace(/\.[^/.]+$/, ""),
        url: URL.createObjectURL(file)
      }));

      renderPlaylist();
      loadTrack(0);
      playTrack();
    });

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        item.textContent = `${index + 1}. ${track.title}`;
        item.addEventListener('click', () => {
          loadTrack(index);
          playTrack();
        });
        playlistEl.appendChild(item);
      });
    }

    function loadTrack(index) {
      if (!tracks.length) return;
      currentIndex = index;
      audio.src = tracks[currentIndex].url;
      trackTitle.textContent = tracks[currentIndex].title;
      trackArtist.textContent = "Atlas Player";
      renderPlaylist();

      // Notificaciones y pantalla de bloqueo nativa
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: tracks[currentIndex].title,
          artist: "Atlas Player",
          artwork: [{ src: 'ICONO_ATLAS.jpg', sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', playTrack);
        navigator.mediaSession.setActionHandler('pause', pauseTrack);
        navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
        navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
      }
    }

    function playTrack() {
      if (!tracks.length) return;
      audio.play();
      playBtn.textContent = '⏸';
    }

    function pauseTrack() {
      audio.pause();
      playBtn.textContent = '▶';
    }

    function prevTrack() {
      if (!tracks.length) return;
      currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentIndex);
      playTrack();
    }

    function nextTrack() {
      if (!tracks.length) return;
      currentIndex = (currentIndex + 1) % tracks.length;
      loadTrack(currentIndex);
      playTrack();
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        playTrack();
      } else {
        pauseTrack();
      }
    });

    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    audio.addEventListener('ended', nextTrack);

    // Actualización de tiempo y barra
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        progressBar.max = Math.floor(audio.duration);
        progressBar.value = Math.floor(audio.currentTime);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });

    volumeBar.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Registrar Service Worker para soporte PWA si existe
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
