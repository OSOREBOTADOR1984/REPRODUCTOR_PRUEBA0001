<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ATLAS PLAYER</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  
  <!-- Compatibilidad iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas Player">
  <link rel="apple-touch-icon" href="icono-oso.png">

  <!-- Lectura de metadatos ID3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      padding: 20px 15px;
    }

    /* PANTALLA DE BLOQUEO POR TOKEN */
    #lockScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b091a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #designerAlert {
      display: none;
      width: 90%;
      max-width: 400px;
      background: rgba(139, 92, 246, 0.25);
      border: 1px solid #8b5cf6;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 14px 18px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
      text-align: left;
    }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
      color: #c4b5fd;
      margin-bottom: 6px;
    }

    .alert-body {
      font-size: 12px;
      line-height: 1.4;
      color: #f3f4f6;
    }

    .today-token-badge {
      display: inline-block;
      background: #8b5cf6;
      color: #fff;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 4px 10px;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 15px;
      cursor: pointer;
    }

    .lock-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 26px 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .lock-icon {
      font-size: 42px;
      margin-bottom: 12px;
      display: block;
    }

    .lock-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .lock-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 18px;
    }

    .token-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-size: 15px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 14px;
      user-select: text;
      -webkit-user-select: text;
    }

    .token-input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    .btn-unlock {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: #8b5cf6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-unlock:hover {
      background: #7c3aed;
    }

    .lock-error {
      color: #ff5555;
      font-size: 11px;
      margin-top: 10px;
      min-height: 16px;
    }

    /* REPRODUCTOR */
    .player-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cover-container {
      width: 190px;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-placeholder {
      font-size: 50px;
      color: rgba(255, 255, 255, 0.2);
    }

    .track-info {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
    }

    .track-title {
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-box {
      width: 100%;
      margin-bottom: 16px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #8b5cf6;
      border-radius: 10px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      width: 100%;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .btn-toggle {
      width: 36px;
      height: 36px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-toggle.active {
      color: #8b5cf6;
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.2);
    }

    .btn-play {
      width: 52px;
      height: 52px;
      background: #8b5cf6;
      border-color: #8b5cf6;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-play:hover {
      background: #7c3aed;
    }

    /* MÓDULO DE DESCARGA CON ALTERNATIVA EXTERNA */
    .downloader-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .downloader-row {
      display: flex;
      gap: 6px;
    }

    #urlInput {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    #urlInput:focus {
      border-color: #8b5cf6;
    }

    .btn-download-url {
      background: #8b5cf6;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-external-tool {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #c4b5fd;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-external-tool:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .download-status {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      min-height: 14px;
    }

    .actions-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.12);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    .playlist-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #8b5cf6;
      color: #ffffff;
      border-color: #8b5cf6;
    }

    .search-container {
      width: 100%;
      margin-bottom: 12px;
    }

    #searchInput {
      width: 100%;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .playlist-container {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px;
    }

    .song-item {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 2px;
    }

    .song-item.active {
      background: rgba(139, 92, 246, 0.25);
      border-left: 3px solid #8b5cf6;
    }

    .song-details {
      flex: 1;
      min-width: 0;
    }

    .song-title-row {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist-row {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .star-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      font-size: 16px;
      cursor: pointer;
    }

    .star-btn.fav {
      color: #ffd700;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO POR TOKEN -->
  <div id="lockScreen">
    <div id="designerAlert">
      <div class="alert-header">
        <span>⚡ PANEL DEL DISEÑADOR</span>
        <span id="tokenExpiry">Expira a las 23:59</span>
      </div>
      <div class="alert-body">
        Token de activación para hoy:
        <div>
          <span class="today-token-badge" id="todayTokenBadge" title="Toca para copiar">------</span>
        </div>
        <small style="color: #c4b5fd; display:block; margin-top:4px;">(Toca el código para copiarlo y enviarlo)</small>
      </div>
    </div>

    <div class="lock-box">
      <span class="lock-icon">🔒</span>
      <div class="lock-title" id="lockTitleBtn">ACCESO ATLAS</div>
      <div class="lock-desc">Introduce tu token para desbloquear tu acceso.</div>
      <input type="password" id="tokenField" class="token-input" placeholder="Código de 6 dígitos" autocomplete="off">
      <button class="btn-unlock" id="btnUnlock">Activar</button>
      <div class="lock-error" id="lockError"></div>
    </div>
  </div>

  <div class="player-card">
    <div class="cover-container">
      <img id="coverImg" alt="Portada">
      <div id="coverPlaceholder" class="cover-placeholder">♪</div>
    </div>

    <div class="track-info">
      <div id="trackTitle" class="track-title">Sin pistas cargadas</div>
      <div id="trackArtist" class="track-artist">Carga archivos o descarga por link</div>
    </div>

    <div class="progress-box">
      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-control btn-toggle" id="shuffleBtn" title="Aleatorio">🔀</button>
      <button class="btn-control" id="prevBtn" title="Anterior">⏮</button>
      <button class="btn-control btn-play" id="playBtn" title="Reproducir">▶</button>
      <button class="btn-control" id="nextBtn" title="Siguiente">⏭</button>
      <button class="btn-control btn-toggle" id="loopBtn" title="Repetir">🔁</button>
    </div>

    <!-- MÓDULO DE DESCARGA VISIBLE CON CONVERSOR DE RESERVA -->
    <div class="downloader-box">
      <div class="downloader-row">
        <input type="text" id="urlInput" placeholder="Pegar enlace de YouTube aquí..." autocomplete="off">
        <button class="btn-download-url" id="btnDownloadUrl">⬇ Descargar</button>
        <a href="https://cobalt.tools" target="_blank" rel="noopener noreferrer" class="btn-external-tool" title="Si la API falla, abre este extractor">🌐 Web</a>
      </div>
      <div class="download-status" id="downloadStatus"></div>
    </div>

    <div class="actions-bar">
      <label class="action-btn" for="audioFiles">📁 Cargar Música</label>
      <input type="file" id="audioFiles" accept=".m4a,.mp3,.aac,.wav,.ogg,.opus,audio/*" multiple>

      <button class="action-btn" id="exportBackupBtn">💾 Respaldar</button>
      
      <label class="action-btn" for="importBackupInput">📥 Restaurar</label>
      <input type="file" id="importBackupInput" accept=".json,application/json">
    </div>

    <div class="playlist-tabs" id="playlistTabs">
      <button class="tab-btn active" data-tab="todas">Todas</button>
      <button class="tab-btn" data-tab="favoritos">⭐ Favoritas</button>
      <button class="tab-btn" id="createPlaylistBtn">+ Crear Lista</button>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar por canción o artista..." autocomplete="off">
    </div>

    <div class="playlist-container" id="playlistContainer"></div>
  </div>

  <audio id="audioElement" playsinline preload="auto"></audio>

  <script>
    // --- SEGURIDAD: TOKEN DIARIO Y LICENCIA PERMANENTE ---
    const SECRET_SALT = "ATLAS_SECRET_2026";
    const MASTER_DESIGNER_KEY = "ATLAS_CREADOR";

    function getTodayDateString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    async function generateDailyToken(dateStr) {
      const msg = SECRET_SALT + "_" + dateStr;
      const msgBuffer = new TextEncoder().encode(msg);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const num = ((hashArray[0] << 24) | (hashArray[1] << 16) | (hashArray[2] << 8) | hashArray[3]) >>> 0;
      return String(num % 900000 + 100000);
    }

    const lockScreen = document.getElementById('lockScreen');
    const designerAlert = document.getElementById('designerAlert');
    const todayTokenBadge = document.getElementById('todayTokenBadge');
    const tokenField = document.getElementById('tokenField');
    const btnUnlock = document.getElementById('btnUnlock');
    const lockError = document.getElementById('lockError');
    const lockTitleBtn = document.getElementById('lockTitleBtn');

    let currentDailyToken = "";

    const hasLifetimeLicense = localStorage.getItem('atlas_lifetime_license') === 'active';
    const isDesigner = localStorage.getItem('atlas_role') === 'designer';

    if (hasLifetimeLicense || isDesigner) {
      lockScreen.style.display = 'none';
    }

    async function initAuth() {
      const today = getTodayDateString();
      currentDailyToken = await generateDailyToken(today);

      if (isDesigner) {
        designerAlert.style.display = 'block';
        todayTokenBadge.textContent = currentDailyToken;
      }
    }
    initAuth();

    todayTokenBadge.addEventListener('click', () => {
      navigator.clipboard.writeText(currentDailyToken);
      alert('Token copiado: ' + currentDailyToken);
    });

    btnUnlock.addEventListener('click', async () => {
      const val = tokenField.value.trim();

      if (val === MASTER_DESIGNER_KEY) {
        localStorage.setItem('atlas_role', 'designer');
        designerAlert.style.display = 'block';
        todayTokenBadge.textContent = currentDailyToken;
        lockScreen.style.display = 'none';
        alert('Modo Diseñador activado.');
        return;
      }

      if (val === currentDailyToken) {
        localStorage.setItem('atlas_lifetime_license', 'active');
        lockScreen.style.display = 'none';
        alert('¡Activación permanente completada con éxito!');
      } else {
        lockError.textContent = 'Token incorrecto o no válido para hoy.';
        tokenField.value = '';
      }
    });

    tokenField.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') btnUnlock.click();
    });

    let tapCount = 0;
    lockTitleBtn.addEventListener('click', () => {
      tapCount++;
      if (tapCount >= 3) {
        designerAlert.style.display = 'block';
        todayTokenBadge.textContent = currentDailyToken;
        tapCount = 0;
      }
      setTimeout(() => { tapCount = 0; }, 1500);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('SW error:', err);
        });
      });
    }

    // --- REPRODUCTOR ---
    const audioElement = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const loopBtn = document.getElementById('loopBtn');
    const fileInput = document.getElementById('audioFiles');
    const playlistContainer = document.getElementById('playlistContainer');
    const playlistTabs = document.getElementById('playlistTabs');
    const searchInput = document.getElementById('searchInput');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const coverImg = document.getElementById('coverImg');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const progressBar = document.getElementById('progressBar');
    const progressBarContainer = document
