<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS PLAYER</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <!-- Lectura de metadatos y carátulas ID3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      padding: 20px 15px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 30px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a855f7;
      background: rgba(168, 85, 247, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    /* Carátula de vinilo */
    .vinyl-wrapper {
      position: relative;
      width: 175px;
      height: 175px;
      margin: 0 auto 18px auto;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2d3a 0%, #15151e 65%, #050508 100%);
      border: 6px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .vinyl.spinning {
      animation-play-state: running;
    }

    .vinyl-center {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      background-size: cover;
      background-position: center;
      border: 3px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }

    .vinyl-hole {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f0c29;
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: absolute;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    p.artist {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Botón selector de múltiples archivos */
    .file-input-wrapper {
      margin-bottom: 16px;
    }

    .file-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #a855f7;
      color: #ffffff;
    }

    #fileInput {
      display: none;
    }

    /* Barra de progreso */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    /* Controles principales */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-tool {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 16px;
      border-radius: 12px;
    }

    .btn-tool.active {
      background: #8b5cf6;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
    }

    .btn-secondary {
      width: 46px;
      height: 46px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 18px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-main {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
    }

    .btn-main:hover {
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.6);
      transform: translateY(-2px);
    }

    /* Volumen */
    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 15px;
      margin-bottom: 16px;
    }

    .volume-icon {
      font-size: 14px;
      color: #94a3b8;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #8b5cf6;
      cursor: pointer;
    }

    /* Lista de reproducción (Playlist) */
    .playlist-header {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: left;
      margin: 10px 4px 8px 4px;
      display: flex;
      justify-content: space-between;
    }

    .playlist {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
      text-align: left;
      padding-right: 4px;
    }

    .playlist::-webkit-scrollbar {
      width: 4px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .playlist-item {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
      margin-bottom: 5px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .playlist-item.active {
      background: rgba(139, 92, 246, 0.3);
      border-left: 3px solid #ec4899;
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <span class="badge" id="sourceBadge">ATLAS PLAYER</span>

    <div class="vinyl-wrapper">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-center" id="vinylCenter">
          <span id="centerIcon">🐻</span>
          <div class="vinyl-hole"></div>
        </div>
      </div>
    </div>

    <h2 id="songTitle">Melodía de Prueba</h2>
    <p class="artist" id="artistName">SoundHelix &bull; Piano Synth</p>

    <!-- Selector múltiple -->
    <div class="file-input-wrapper">
      <label for="fileInput" class="file-btn">
        📁 Cargar música (múltiples)
      </label>
      <input type="file" id="fileInput" accept="audio/*" multiple>
    </div>

    <!-- Progreso -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="duration">--:--</span>
    </div>

    <!-- Controles con Shuffle y Repeat -->
    <div class="controls">
      <button class="btn btn-tool" id="shuffleBtn" title="Modo Aleatorio">🔀</button>
      <button class="btn btn-secondary" id="prevBtn" title="Anterior">⏮</button>
      <button class="btn btn-main" id="playBtn" title="Reproducir / Pausar">▶</button>
      <button class="btn btn-secondary" id="nextBtn" title="Siguiente">⏭</button>
      <button class="btn btn-tool" id="repeatBtn" title="Repetir">🔁</button>
    </div>

    <!-- Volumen -->
    <div class="volume-container">
      <span class="volume-icon">🔈</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
      <span class="volume-icon">🔊</span>
    </div>

    <!-- Lista de reproducción -->
    <div class="playlist-header">
      <span>Cola de reproducción</span>
      <span id="trackCount">1 pista</span>
    </div>
    <ul class="playlist" id="playlist">
      <li class="playlist-item active">1. SoundHelix (Demo)</li>
    </ul>
  </div>

  <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" playsinline></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const vinyl = document.getElementById('vinyl');
    const vinylCenter = document.getElementById('vinylCenter');
    const centerIcon = document.getElementById('centerIcon');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const fileInput = document.getElementById('fileInput');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const sourceBadge = document.getElementById('sourceBadge');
    const playlistEl = document.getElementById('playlist');
    const trackCountEl = document.getElementById('trackCount');

    const defaultCover = 'https://cdn-icons-png.flaticon.com/512/1998/1998610.png';

    // Estado del reproductor
    let tracks = [
      { name: "SoundHelix (Demo)", artist: "Piano Synth", src: audio.src, file: null }
    ];
    let currentIndex = 0;
    let isShuffle = false;
    let isRepeat = false;

    // Media Session (segundo plano y pantalla bloqueada)
    function updateMediaSession(title, artist, artworkUrl) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          album: 'ATLAS PLAYER',
          artwork: [
            { src: artworkUrl || defaultCover, sizes: '512x512', type: 'image/png' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', playAudio);
        navigator.mediaSession.setActionHandler('pause', pauseAudio);
        navigator.mediaSession.setActionHandler('previoustrack', playPrevTrack);
        navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
      }
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        li.textContent = `${index + 1}. ${track.name}`;
        li.addEventListener('click', () => {
          loadTrack(index);
          playAudio();
        });
        playlistEl.appendChild(li);
      });
      trackCountEl.textContent = `${tracks.length} pista${tracks.length > 1 ? 's' : ''}`;
    }

    function loadTrack(index) {
      currentIndex = index;
      const track = tracks[currentIndex];
      audio.src = track.src;
      songTitle.textContent = track.name;
      artistName.textContent = track.artist || "Archivo local";

      // Reset carátula a oso por defecto
      vinylCenter.style.backgroundImage = 'none';
      centerIcon.style.display = 'block';

      // Si es archivo local, extraer carátula y etiquetas
      if (track.file && window.jsmediatags) {
        window.jsmediatags.read(track.file, {
          onSuccess: function(tag) {
            const tags = tag.tags;
            if (tags.title) songTitle.textContent = tags.title;
            if (tags.artist) artistName.textContent = tags.artist;

            let cover = null;
            if (tags.picture) {
              let base64String = "";
              for (let i = 0; i < tags.picture.data.length; i++) {
                base64String += String.fromCharCode(tags.picture.data[i]);
              }
              cover = "data:" + tags.picture.format + ";base64," + window.btoa(base64String);
              vinylCenter.style.backgroundImage = `url(${cover})`;
              centerIcon.style.display = 'none';
            }
            updateMediaSession(songTitle.textContent, artistName.textContent, cover);
          },
          onError: function() {
            updateMediaSession(track.name, track.artist, defaultCover);
          }
        });
      } else {
        updateMediaSession(track.name, track.artist, defaultCover);
      }

      renderPlaylist();
    }

    function playAudio() {
      audio.play().then(() => {
        playBtn.textContent = '⏸';
        vinyl.classList.add('spinning');
      }).catch(() => {
        playBtn.textContent = '▶';
        vinyl.classList.remove('spinning');
      });
    }

    function pauseAudio() {
      audio.pause();
      playBtn.textContent = '▶';
      vinyl.classList.remove('spinning');
    }

    function playNextTrack() {
      if (isShuffle && tracks.length > 1) {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * tracks.length);
        } while (randomIndex === currentIndex);
        loadTrack(randomIndex);
      } else {
        currentIndex = (currentIndex + 1) % tracks.length;
        loadTrack(currentIndex);
      }
      playAudio();
    }

    function playPrevTrack() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
        loadTrack(currentIndex);
        playAudio();
      }
    }

    // Carga de múltiples archivos
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        tracks = files.map(file => ({
          name: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Archivo local",
          src: URL.createObjectURL(file),
          file: file
        }));

        sourceBadge.textContent = "Tu Música";
        sourceBadge.style.color = "#10b981";
        sourceBadge.style.background = "rgba(16, 185, 129, 0.15)";

        loadTrack(0);
        playAudio();
      }
    });

    // Botones de reproducción
    playBtn.addEventListener('click', () => {
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    nextBtn.addEventListener('click', playNextTrack);
    prevBtn.addEventListener('click', playPrevTrack);

    // Conmutadores Shuffle y Repeat
    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
    });

    // Al finalizar la canción actual
    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        playAudio();
      } else {
        playNextTrack();
      }
    });

    // Control de volumen
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    // Barra de tiempo
    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = percent + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    // Inicio
    updateMediaSession('Melodía de Prueba', 'SoundHelix', defaultCover);
  </script>
</body>
</html>
