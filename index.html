<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 16px; background-color: #181818; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #282828; }
    #playlist-container { flex: 1; overflow-y: auto; padding: 10px; }
    .track-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #1e1e1e; }
    .track-item:hover, .track-item.active { background-color: #282828; }
    .track-info { display: flex; flex-direction: column; }
    .track-title { font-weight: 600; font-size: 0.95rem; }
    .track-artist { font-size: 0.8rem; color: #b3b3b3; margin-top: 2px; }
    
    /* Barra del reproductor */
    #player-bar { background-color: #181818; padding: 14px 20px; border-top: 1px solid #282828; display: flex; flex-direction: column; gap: 8px; }
    .now-playing { font-size: 0.85rem; color: #1db954; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-bar-container { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: #b3b3b3; }
    input[type="range"] { flex: 1; accent-color: #1db954; cursor: pointer; }
    
    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 4px; }
    button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; }
    button:active { transform: scale(0.92); }
    #btn-play { background-color: #1db954; color: #000; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; }
  </style>
</head>
<body>

  <header>ATLAS PLAYER</header>

  <div id="playlist-container">
    <div id="playlist"></div>
  </div>

  <div id="player-bar">
    <div class="now-playing" id="now-playing">Selecciona una pista</div>
    
    <div class="progress-bar-container">
      <span id="current-time">0:00</span>
      <input type="range" id="seek-bar" value="0" min="0" step="1">
      <span id="duration-time">0:00</span>
    </div>

    <div class="controls">
      <button id="btn-prev">⏮</button>
      <button id="btn-play">▶</button>
      <button id="btn-next">⏭</button>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeText = document.getElementById('current-time');
    const durationTimeText = document.getElementById('duration-time');
    const nowPlayingText = document.getElementById('now-playing');
    const playlistEl = document.getElementById('playlist');

    let tracks = [];
    let currentIndex = 0;

    // Cargar la lista de canciones generada por Python
    fetch('playlist.json')
      .then(res => res.json())
      .then(data => {
        tracks = data;
        renderPlaylist();
      })
      .catch(() => {
        nowPlayingText.innerText = "Ejecuta generar_playlist.py primero";
      });

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `track-item ${index === currentIndex ? 'active' : ''}`;
        item.innerHTML = `
          <div class="track-info">
            <span class="track-title">${track.title}</span>
            <span class="track-artist">${track.artist || 'Desconocido'}</span>
          </div>
        `;
        item.onclick = () => playTrack(index);
        playlistEl.appendChild(item);
      });
    }

    function formatTime(secs) {
      if (isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function playTrack(index) {
      currentIndex = index;
      const track = tracks[currentIndex];
      audio.src = track.file;
      audio.play();
      btnPlay.innerText = '⏸';
      nowPlayingText.innerText = `${track.title} - ${track.artist || ''}`;
      renderPlaylist();
    }

    btnPlay.onclick = () => {
      if (!audio.src && tracks.length > 0) {
        playTrack(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        btnPlay.innerText = '⏸';
      } else {
        audio.pause();
        btnPlay.innerText = '▶';
      }
    };

    btnPrev.onclick = () => {
      if (tracks.length === 0) return;
      currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
      playTrack(currentIndex);
    };

    btnNext.onclick = () => {
      if (tracks.length === 0) return;
      currentIndex = (currentIndex + 1) % tracks.length;
      playTrack(currentIndex);
    };

    audio.ontimeupdate = () => {
      seekBar.value = audio.currentTime;
      currentTimeText.innerText = formatTime(audio.currentTime);
    };

    audio.onloadedmetadata = () => {
      seekBar.max = Math.floor(audio.duration);
      durationTimeText.innerText = formatTime(audio.duration);
    };

    seekBar.oninput = () => {
      audio.currentTime = seekBar.value;
    };

    audio.onended = () => {
      btnNext.click();
    };

    // Registro de Service Worker para PWA Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
