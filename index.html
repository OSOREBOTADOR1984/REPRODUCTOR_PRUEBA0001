<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Reproductor MP3 Moderno</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <!-- Biblioteca para leer metadatos y carátula incrustada del MP3/Audio -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      padding: 20px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 35px 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a855f7;
      background: rgba(168, 85, 247, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    /* Carátula de vinilo con portada de álbum */
    .vinyl-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      margin: 0 auto 20px auto;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2d3a 0%, #15151e 65%, #050508 100%);
      border: 6px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .vinyl.spinning {
      animation-play-state: running;
    }

    .vinyl-center {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      background-size: cover;
      background-position: center;
      border: 3px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }

    /* Pequeño centro del disco */
    .vinyl-hole {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f0c29;
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: absolute;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h2 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    p.artist {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Botón para subir archivo */
    .file-input-wrapper {
      margin-bottom: 20px;
    }

    .file-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      color: #e2e8f0;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #a855f7;
      color: #ffffff;
    }

    #fileInput {
      display: none;
    }

    /* Barra de progreso interactiva */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* Botones de control */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-secondary {
      width: 46px;
      height: 46px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 18px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-main {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
    }

    .btn-main:hover {
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.6);
      transform: translateY(-2px);
    }

    /* Control de volumen */
    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 15px;
    }

    .volume-icon {
      font-size: 14px;
      color: #94a3b8;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #8b5cf6;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <span class="badge" id="sourceBadge">Pista por defecto</span>

    <div class="vinyl-wrapper">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-center" id="vinylCenter">
          <span id="centerIcon">🎵</span>
          <div class="vinyl-hole"></div>
        </div>
      </div>
    </div>

    <h2 id="songTitle">Melodía de Prueba</h2>
    <p class="artist" id="artistName">SoundHelix &bull; Piano Synth</p>

    <!-- Botón para elegir archivo de música -->
    <div class="file-input-wrapper">
      <label for="fileInput" class="file-btn">
        📁 Elegir mi música
      </label>
      <input type="file" id="fileInput" accept="audio/*">
    </div>

    <!-- Barra de progreso -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="duration">--:--</span>
    </div>

    <!-- Botones principales -->
    <div class="controls">
      <button class="btn btn-secondary" id="rewindBtn" title="Reiniciar">⏮</button>
      <button class="btn btn-main" id="playBtn" title="Reproducir / Pausar">▶</button>
      <button class="btn btn-secondary" id="forwardBtn" title="+10 segundos">⏩</button>
    </div>

    <!-- Barra de volumen -->
    <div class="volume-container">
      <span class="volume-icon">🔈</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
      <span class="volume-icon">🔊</span>
    </div>
  </div>

  <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" playsinline></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const vinyl = document.getElementById('vinyl');
    const vinylCenter = document.getElementById('vinylCenter');
    const centerIcon = document.getElementById('centerIcon');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const fileInput = document.getElementById('fileInput');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const sourceBadge = document.getElementById('sourceBadge');

    const defaultCover = 'https://cdn-icons-png.flaticon.com/512/3075/3075908.png';

    // Función para actualizar controles del sistema (pantalla bloqueada)
    function updateMediaSession(title, artist, artworkUrl) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          album: 'Mi Reproductor',
          artwork: [
            { src: artworkUrl || defaultCover, sizes: '512x512', type: 'image/png' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => {
          audio.play();
          playBtn.textContent = '⏸';
          vinyl.classList.add('spinning');
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          audio.pause();
          playBtn.textContent = '▶';
          vinyl.classList.remove('spinning');
        });

        navigator.mediaSession.setActionHandler('seekbackward', () => {
          audio.currentTime = Math.max(audio.currentTime - 10, 0);
        });

        navigator.mediaSession.setActionHandler('seekforward', () => {
          audio.currentTime = Math.min(audio.currentTime + 10, audio.duration || 0);
        });
      }
    }

    updateMediaSession('Melodía de Prueba', 'SoundHelix', defaultCover);

    // Cargar archivo y extraer carátula y metadatos
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const fileUrl = URL.createObjectURL(file);
        audio.src = fileUrl;

        let displayTitle = file.name.replace(/\.[^/.]+$/, "");
        let displayArtist = "Archivo local";
        let coverUrl = null;

        sourceBadge.textContent = "Tu Música";
        sourceBadge.style.color = "#10b981";
        sourceBadge.style.background = "rgba(16, 185, 129, 0.15)";

        // Leer etiquetas y portada con jsmediatags
        if (window.jsmediatags) {
          window.jsmediatags.read(file, {
            onSuccess: function(tag) {
              const tags = tag.tags;
              if (tags.title) displayTitle = tags.title;
              if (tags.artist) displayArtist = tags.artist;

              const image = tags.picture;
              if (image) {
                let base64String = "";
                for (let i = 0; i < image.data.length; i++) {
                  base64String += String.fromCharCode(image.data[i]);
                }
                const base64 = "data:" + image.format + ";base64," + window.btoa(base64String);
                coverUrl = base64;
                vinylCenter.style.backgroundImage = `url(${base64})`;
                centerIcon.style.display = 'none';
              } else {
                // Si el audio no tiene imagen incrustada
                vinylCenter.style.backgroundImage = 'none';
                centerIcon.style.display = 'block';
              }

              songTitle.textContent = displayTitle;
              artistName.textContent = displayArtist;
              updateMediaSession(displayTitle, displayArtist, coverUrl);
            },
            onError: function() {
              // Si falla la lectura de metadatos, usar valores por defecto
              songTitle.textContent = displayTitle;
              artistName.textContent = displayArtist;
              vinylCenter.style.backgroundImage = 'none';
              centerIcon.style.display = 'block';
              updateMediaSession(displayTitle, displayArtist, defaultCover);
            }
          });
        } else {
          songTitle.textContent = displayTitle;
          artistName.textContent = displayArtist;
        }

        audio.play().then(() => {
          playBtn.textContent = '⏸';
          vinyl.classList.add('spinning');
        }).catch(() => {
          playBtn.textContent = '▶';
          vinyl.classList.remove('spinning');
        });
      }
    });

    // Control Play / Pausa
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '⏸';
        vinyl.classList.add('spinning');
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        vinyl.classList.remove('spinning');
      }
    });

    // Reiniciar
    rewindBtn.addEventListener('click', () => {
      audio.currentTime = 0;
    });

    // Adelantar 10 segundos
    forwardBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.currentTime + 10, audio.duration || 0);
    });

    // Control de volumen
    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    // Formatear minutos y segundos
    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = percent + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    // Adelantar al hacer clic en la barra
    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    // Al finalizar la canción
    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
      vinyl.classList.remove('spinning');
      progressBar.style.width = '0%';
    });
  </script>
</body>
</html>
