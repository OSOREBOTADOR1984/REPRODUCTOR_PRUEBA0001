<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS PLAYER</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <!-- Lectura de metadatos y carátulas ID3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      padding: 20px 15px;
    }

    .player-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cover-container {
      width: 190px;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-placeholder {
      font-size: 50px;
      color: rgba(255, 255, 255, 0.2);
    }

    .track-info {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
    }

    .track-title {
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de progreso */
    .progress-box {
      width: 100%;
      margin-bottom: 16px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #8b5cf6;
      border-radius: 10px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
    }

    /* Botones de control */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .btn-play {
      width: 54px;
      height: 54px;
      background: #8b5cf6;
      border-color: #8b5cf6;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-play:hover {
      background: #7c3aed;
    }

    /* Acciones: Cargar y Respaldo */
    .actions-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.12);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    input[type="file"] {
      display: none;
    }

    /* Pestañas de Playlists (Todas / Favoritos / Crear) */
    .playlist-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .playlist-tabs::-webkit-scrollbar {
      height: 4px;
    }

    .playlist-tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #8b5cf6;
      color: #ffffff;
      border-color: #8b5cf6;
    }

    /* Buscador */
    .search-container {
      width: 100%;
      margin-bottom: 12px;
    }

    #searchInput {
      width: 100%;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s ease;
    }

    #searchInput:focus {
      border-color: #8b5cf6;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
    }

    #searchInput::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    /* Lista de canciones */
