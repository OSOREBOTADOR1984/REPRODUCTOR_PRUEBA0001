<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS PLAYER</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <!-- Lectura de metadatos y carátulas ID3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      padding: 20px 15px;
    }

    .player-card {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cover-container {
      width: 200px;
      height: 200px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-placeholder {
      font-size: 50px;
      color: rgba(255, 255, 255, 0.2);
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .track-title {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .track-artist {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de progreso */
    .progress-box {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #8b5cf6;
      border-radius: 10px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
    }

    /* Botones de control */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .btn-play {
      width: 60px;
      height: 60px;
      background: #8b5cf6;
      border-color: #8b5cf6;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-play:hover {
      background: #7c3aed;
    }

    /* Selector de archivo */
    .file-input-wrapper {
      margin-bottom: 20px;
      width: 100%;
      text-align: center;
    }

    .file-label {
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }

    .file-label:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    input[type="file"] {
      display: none;
    }

    /* Buscador */
    .search-container {
      width: 100%;
      margin-bottom: 15px;
    }

    #searchInput {
      width: 100%;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    #searchInput:focus {
      border-color: #8b5cf6;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }

    #searchInput::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    /* Lista de canciones */
    .playlist-container {
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px;
    }

    .playlist-container::-webkit-scrollbar {
      width: 6px;
    }

    .playlist-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .song-item {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background 0.2s ease;
      margin-bottom: 2px;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .song-item.active {
      background: rgba(139, 92, 246, 0.25);
      border-left: 3px solid #8b5cf6;
    }

    .song-title-row {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist-row {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Portada -->
    <div class="cover-container">
      <img id="coverImg" alt="Portada de canción">
      <div id="coverPlaceholder" class="cover-placeholder">♪</div>
    </div>

    <!-- Título y Artista actual -->
    <div class="track-info">
      <div id="trackTitle" class="track-title">Sin pistas cargadas</div>
      <div id="trackArtist" class="track-artist">Selecciona tus archivos de audio</div>
    </div>

    <!-- Barra de Tiempo y Progreso -->
    <div class="progress-box">
      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button class="btn-control" id="prevBtn" title="Anterior">⏮</button>
      <button class="btn-control btn-play" id="playBtn" title="Reproducir">▶</button>
      <button class="btn-control" id="nextBtn" title="Siguiente">⏭</button>
    </div>

    <!-- Cargar archivos -->
    <div class="file-input-wrapper">
      <label class="file-label" for="audioFiles">📁 Cargar canciones (MP3)</label>
      <input type="file" id="audioFiles" accept="audio/*" multiple>
    </div>

    <!-- Barra de búsqueda dinámica -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar por canción o artista..." autocomplete="off">
    </div>

    <!-- Lista de reproducción -->
    <div class="playlist-container" id="playlistContainer"></div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    // Registro del Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('Fallo en Service Worker:', err);
        });
      });
    }

    // Elementos del DOM
    const audioElement = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fileInput = document.getElementById('audioFiles');
    const playlistContainer = document.getElementById('playlistContainer');
    const searchInput = document.getElementById('searchInput');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const coverImg = document.getElementById('coverImg');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const progressBar = document.getElementById('progressBar');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const currentTimeText = document.getElementById('currentTime');
    const durationTimeText = document.getElementById('durationTime');

    let playlist = [];
    let currentIndex = 0;
    let isPlaying = false;

    // Formatear segundos a mm:ss
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Carga de archivos y extracción de metadatos
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      playlist = files.map((file, idx) => ({
        index: idx,
        file: file,
        url: URL.createObjectURL(file),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: 'Artista Desconocido'
      }));

      renderPlaylist();
      extractMetadataForFiles();
      loadTrack(0);
    });

    // Renderizado de lista en pantalla
    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlist.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
        item.dataset.index = idx;

        item.innerHTML = `
          <div class="song-title-row">${track.title}</div>
          <div class="song-artist-row">${track.artist}</div>
        `;

        item.addEventListener('click', () => {
          loadTrack(track.index);
          playAudio();
        });

        playlistContainer.appendChild(item);
      });
    }

    // Leer tags ID3 (Carátula, Título, Artista)
    function extractMetadataForFiles() {
      if (!window.jsmediatags) return;

      playlist.forEach((track) => {
        window.jsmediatags.read(track.file, {
          onSuccess: (tag) => {
            const tags = tag.tags;
            if (tags.title) track.title = tags.title;
            if (tags.artist) track.artist = tags.artist;
            if (tags.picture) track.picture = tags.picture;

            // Actualizar vista de este elemento en la lista
            const domItem = playlistContainer.querySelector(`[data-index="${track.index}"]`);
            if (domItem) {
              domItem.querySelector('.song-title-row').textContent = track.title;
              domItem.querySelector('.song-artist-row').textContent = track.artist;
            }

            // Si es la pista actual, actualizar tarjeta principal
            if (track.index === currentIndex) {
              updateTrackDisplay(track);
            }
          },
          onError: () => {}
        });
      });
    }

    // Cargar pista en el reproductor
    function loadTrack(index) {
      if (!playlist[index]) return;
      currentIndex = index;
      const track = playlist[index];
      audioElement.src = track.url;
      updateTrackDisplay(track);
      highlightCurrentInList();
    }

    // Actualizar portada, textos principales
    function updateTrackDisplay(track) {
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;

      if (track.picture) {
        const { data, format } = track.picture;
        let base64String = "";
        for (let i = 0; i < data.length; i++) {
          base64String += String.fromCharCode(data[i]);
        }
        coverImg.src = `data:${format};base64,${window.btoa(base64String)}`;
        coverImg.style.display = 'block';
        coverPlaceholder.style.display = 'none';
      } else {
        coverImg.style.display = 'none';
        coverPlaceholder.style.display = 'block';
      }
    }

    function highlightCurrentInList() {
      const items = playlistContainer.querySelectorAll('.song-item');
      items.forEach(item => {
        if (parseInt(item.dataset.index) === currentIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    // Reproducción y pausa
    function playAudio() {
      audioElement.play();
      isPlaying = true;
      playBtn.textContent = '⏸';
    }

    function pauseAudio() {
      audioElement.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
    }

    playBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    });

    // Pista anterior y siguiente
    prevBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
      playAudio();
    });

    nextBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
      playAudio();
    });

    // Cambio automático al terminar
    audioElement.addEventListener('ended', () => {
      nextBtn.click();
    });

    // Progreso de tiempo
    audioElement.addEventListener('timeupdate', () => {
      if (audioElement.duration) {
        const percent = (audioElement.currentTime / audioElement.duration) * 100;
        progressBar.style.width = `${percent}%`;
        currentTimeText.textContent = formatTime(audioElement.currentTime);
        durationTimeText.textContent = formatTime(audioElement.duration);
      }
    });

    // Salto de barra de progreso al hacer clic
    progressBarContainer.addEventListener('click', (e) => {
      if (!audioElement.duration) return;
      const rect = progressBarContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audioElement.currentTime = (clickX / width) * audioElement.duration;
    });

    // Filtro y búsqueda en tiempo real
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const items = playlistContainer.querySelectorAll('.song-item');

      items.forEach(item => {
        const titleText = item.querySelector('.song-title-row').textContent.toLowerCase();
        const artistText = item.querySelector('.song-artist-row').textContent.toLowerCase();

        if (titleText.includes(query) || artistText.includes(query)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
