<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { padding: 14px 20px; background-color: #181818; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282828; }
    .brand { font-size: 1.1rem; font-weight: 800; letter-spacing: 1.5px; color: #1db954; }
    #search-box { background: #282828; border: 1px solid #3e3e3e; color: #fff; padding: 8px 14px; border-radius: 20px; outline: none; width: 220px; font-size: 0.85rem; }
    #search-box:focus { border-color: #1db954; }

    #playlist-container { flex: 1; overflow-y: auto; padding: 12px; }
    .track-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid #1c1c1c; }
    .track-item:hover { background-color: #242424; }
    .track-item.active { background-color: #2a2a2a; border-left: 4px solid #1db954; }
    
    .track-img { width: 44px; height: 44px; border-radius: 6px; background-color: #282828; object-fit: cover; flex-shrink: 0; }
    .track-info { display: flex; flex-direction: column; overflow: hidden; }
    .track-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.8rem; color: #b3b3b3; margin-top: 3px; }
    
    #player-bar { background-color: #181818; padding: 12px 20px; border-top: 1px solid #282828; display: flex; flex-direction: column; gap: 8px; }
    
    .player-top { display: flex; align-items: center; justify-content: space-between; }
    .current-meta { display: flex; align-items: center; gap: 12px; max-width: 45%; }
    #player-cover { width: 48px; height: 48px; border-radius: 6px; background: #282828; object-fit: cover; }
    .current-text { overflow: hidden; }
    #now-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #now-artist { font-size: 0.75rem; color: #b3b3b3; margin-top: 2px; }
    
    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #b3b3b3; }
    .volume-box input { width: 90px; accent-color: #1db954; cursor: pointer; }

    .progress-bar-container { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: #b3b3b3; }
    input[type="range"] { flex: 1; accent-color: #1db954; cursor: pointer; height: 4px; }
    
    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
    button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s, transform 0.1s; }
    button:active { transform: scale(0.92); }
    button.active-toggle { color: #1db954; font-weight: bold; }
    #btn-play { background-color: #1db954; color: #000; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">ATLAS PLAYER</div>
    <input type="text" id="search-box" placeholder="Buscar canción o artista...">
  </header>

  <div id="playlist-container">
    <div id="playlist"></div>
  </div>

  <div id="player-bar">
    <div class="player-top">
      <div class="current-meta">
        <img id="player-cover" src="" style="display: none;">
        <div class="current-text">
          <div id="now-title">Selecciona una pista</div>
          <div id="now-artist">Listo para sonar</div>
        </div>
      </div>
      
      <div class="volume-box">
        <span>🔊</span>
        <input type="range" id="vol-bar" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
    
    <div class="progress-bar-container">
      <span id="current-time">0:00</span>
      <input type="range" id="seek-bar" value="0" min="0" step="1">
      <span id="duration-time">0:00</span>
    </div>

    <div class="controls">
      <button id="btn-shuffle" title="Aleatorio">🔀</button>
      <button id="btn-prev" title="Anterior">⏮</button>
      <button id="btn-play" title="Play / Pausa">▶</button>
      <button id="btn-next" title="Siguiente">⏭</button>
      <button id="btn-loop" title="Repetir">🔁</button>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnLoop = document.getElementById('btn-loop');
    const seekBar = document.getElementById('seek-bar');
    const volBar = document.getElementById('vol-bar');
    const currentTimeText = document.getElementById('current-time');
    const durationTimeText = document.getElementById('duration-time');
    const nowTitle = document.getElementById('now-title');
    const nowArtist = document.getElementById('now-artist');
    const playerCover = document.getElementById('player-cover');
    const playlistEl = document.getElementById('playlist');
    const searchBox = document.getElementById('search-box');

    let tracks = [];
    let filteredIndices = [];
    let currentIndex = 0;
    let isShuffle = false;
    let isLoop = false;

    fetch('playlist.json')
      .then(res => res.json())
      .then(data => {
        tracks = data;
        filteredIndices = tracks.map((_, i) => i);
        renderPlaylist();
      })
      .catch(() => {
        nowTitle.innerText = "Error cargando playlist.json";
      });

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      filteredIndices.forEach((trackIdx) => {
        const track = tracks[trackIdx];
        const item = document.createElement('div');
        item.className = `track-item ${trackIdx === currentIndex ? 'active' : ''}`;
        
        const coverHtml = track.cover ? `<img class="track-img" src="${track.cover}">` : `<div class="track-img" style="display:flex;align-items:center;justify-content:center;color:#666;">🎵</div>`;
        
        item.innerHTML = `
          ${coverHtml}
          <div class="track-info">
            <span class="track-title">${track.title}</span>
            <span class="track-artist">${track.artist || 'Desconocido'}</span>
          </div>
        `;
        item.onclick = () => playTrack(trackIdx);
        playlistEl.appendChild(item);
      });
    }

    function formatTime(secs) {
      if (isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;
      const track = tracks[currentIndex];
      audio.src = track.file;
      audio.play();
      btnPlay.innerText = '⏸';
      nowTitle.innerText = track.title;
      nowArtist.innerText = track.artist || 'Desconocido';
      
      if (track.cover) {
        playerCover.src = track.cover;
        playerCover.style.display = 'block';
      } else {
        playerCover.style.display = 'none';
      }

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: track.album,
          artwork: track.cover ? [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }] : []
        });
      }

      renderPlaylist();
    }

    btnPlay.onclick = () => {
      if (!audio.src && tracks.length > 0) {
        playTrack(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        btnPlay.innerText = '⏸';
      } else {
        audio.pause();
        btnPlay.innerText = '▶';
      }
    };

    function nextTrack() {
      if (tracks.length === 0) return;
      if (isShuffle) {
        let rand = Math.floor(Math.random() * tracks.length);
        playTrack(rand);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    function prevTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex - 1 + tracks.length) % tracks.length);
    }

    btnNext.onclick = nextTrack;
    btnPrev.onclick = prevTrack;

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('active-toggle', isShuffle);
    };

    btnLoop.onclick = () => {
      isLoop = !isLoop;
      audio.loop = isLoop;
      btnLoop.classList.toggle('active-toggle', isLoop);
    };

    volBar.oninput = () => {
      audio.volume = volBar.value;
    };

    audio.ontimeupdate = () => {
      seekBar.value = audio.currentTime;
      currentTimeText.innerText = formatTime(audio.currentTime);
    };

    audio.onloadedmetadata = () => {
      seekBar.max = Math.floor(audio.duration);
      durationTimeText.innerText = formatTime(audio.duration);
    };

    seekBar.oninput = () => {
      audio.currentTime = seekBar.value;
    };

    audio.onended = () => {
      if (!isLoop) nextTrack();
    };

    searchBox.oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      filteredIndices = tracks
        .map((t, idx) => ({ t, idx }))
        .filter(item => item.t.title.toLowerCase().includes(q) || item.t.artist.toLowerCase().includes(q))
        .map(item => item.idx);
      renderPlaylist();
    };

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === searchBox) return;
      if (e.code === 'Space') {
        e.preventDefault();
        btnPlay.click();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime = Math.max(audio.currentTime - 5, 0);
      } else if (e.key.toLowerCase() === 'n') {
        nextTrack();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
